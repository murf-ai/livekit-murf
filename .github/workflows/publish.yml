name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install uv
        run: pip install uv

      - name: Install ruff
        run: uv tool install ruff

      - name: Run ruff check
        run: uv tool run ruff check --output-format=github

      - name: Clean build artifacts
        run: rm -rf dist/ build/ *.egg-info

      - name: Verify tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION=$(grep -o "__version__[ ]*=[ ]*\"[^\"]*\"" livekit/plugins/murf/version.py | cut -d'"' -f2)
          echo "Tag: $TAG_VERSION, File: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag does not match version in livekit/plugins/murf/version.py"
            exit 1
          fi

      - name: Build and Publish to Test PyPI
        run: |
          uv build
          uv publish \
            --username ${{ secrets.PYPI_USER }} \
            --password ${{ secrets.PYPI_TOKEN }}
        env:
          PYPI_USER: ${{ secrets.PYPI_USER }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}